# Phase 5 — multimodal ADPO (anchored DPO). Continues from Phase 3 adapter.
defaults:
  - base

phase: adpo
output_dir: plan2_models/adpo_final
resume_from: plan2_models/cot_sft         # Phase 3 adapter path
pairs: plan2_adpo/preference_pairs_train.json

training:
  epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6                   # DPO is sensitive — start low
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 25
  save_steps: 500
  save_total_limit: 2
  bf16: true
  gradient_checkpointing: true

dpo:
  beta: 0.1                               # standard DPO temperature
  alpha: 0.0                              # extra anchor term (0 = vanilla DPO)
  # If alpha > 0, add alpha * mean((pol_logp - ref_logp)^2) on chosen+rejected
  # as an anchoring penalty on top of the DPO loss.
