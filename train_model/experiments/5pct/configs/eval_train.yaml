# Eval the CoT-SFT checkpoint on training questions (5pct experiment).
defaults:
  - base

phase: eval

data:
  randomize_options: false
  test: train_model/experiments/5pct/data/sft_train.json

stages:
  cot: train_model/experiments/5pct/models/cot_only

generation:
  max_new_tokens: 64
  do_sample: false

output: train_model/experiments/5pct/data/eval_train_cot.json
