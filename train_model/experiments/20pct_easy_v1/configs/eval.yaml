# Phase 6: Final eval for easy-mining ADPO
defaults:
  - base

phase: eval

data:
  randomize_options: false
  test: train_model/experiments/20pct_adaptive_v1/data/sft_test.json

stages:
  base: none
  sft:  train_model/experiments/20pct_adaptive_v1/models/sft
  cot:  train_model/experiments/20pct_adaptive_v1/models/cot
  adpo: train_model/experiments/20pct_easy_v1/models/adpo

generation:
  max_new_tokens: 64
  do_sample: false

output: train_model/experiments/20pct_easy_v1/eval/results.json
