# Phase 5: ADPO with curriculum strategy (easy rejected for wrong, hard for correct).
defaults:
  - base

phase: adpo
output_dir: train_model/experiments/20pct_curriculum_v1/models/adpo
resume_from: train_model/experiments/20pct_curriculum_v1/models/cot
pairs: train_model/experiments/20pct_curriculum_v1/data/preference_pairs_curriculum.json

training:
  epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  dataloader_num_workers: 10
  learning_rate: 5.0e-6
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 10
  save_steps: 500
  save_total_limit: 2
  bf16: true
  gradient_checkpointing: true

dpo:
  beta: 0.1
  alpha: 0.5
