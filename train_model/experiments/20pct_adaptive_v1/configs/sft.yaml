defaults:
  - base

phase: sft
output_dir: train_model/experiments/20pct_adaptive_v1/models/sft

training:
  epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  dataloader_num_workers: 10
  learning_rate: 2.0e-4
  warmup_steps: 50
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 10
  eval_steps: 500
  save_steps: 500
  save_total_limit: 2
  bf16: true
  gradient_checkpointing: true
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
